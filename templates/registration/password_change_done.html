{% extends "base.html" %}

{% block title %}Пароль змінено{% endblock %}

{% block content %}

<div class="password-success-wrapper">

    <section class="password-success-card">

        <div class="password-success-icon">
            ✓
        </div>

        <h1 class="password-success-title">
            Пароль успішно змінено
        </h1>

        <p class="password-success-text">
            Ваш пароль було успішно оновлено.
        </p>

        <a
                class="password-success-btn"
                href="/"
        >
            На головну
        </a>

    </section>

</div>

<style>

.password-success-wrapper {
    max-width: 520px;
}

.password-success-card {
    padding: 38px 32px;

    text-align: center;

    background: rgba(255, 250, 240, .72);

    border: 1px solid rgba(63, 53, 37, .08);
    border-radius: 22px;

    box-shadow: 0 8px 22px rgba(63, 53, 37, .08);

    backdrop-filter: blur(10px);
}

.password-success-icon {
    width: 78px;
    height: 78px;

    margin: 0 auto 22px;

    border-radius: 50%;

    background: rgba(142, 151, 125, .18);

    color: #6f7a61;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;
    font-weight: 700;

    box-shadow: 0 4px 12px rgba(63, 53, 37, .08);
}

.password-success-title {
    margin-top: 0;
    margin-bottom: 12px;

    color: #5a4d37;

    font-size: 30px;
    font-weight: 800;
}

.password-success-text {
    margin-bottom: 30px;

    color: rgba(63, 53, 37, .72);

    font-size: 16px;

    line-height: 1.7;
}

.password-success-btn {
    display: inline-block;

    padding: 12px 22px;

    background: #8A7650;

    color: #fffdf7;

    text-decoration: none;

    border-radius: 12px;

    font-weight: 700;

    box-shadow: 0 4px 12px rgba(63, 53, 37, .08);

    transition: .2s ease;
}

.password-success-btn:hover {
    background: #756342;

    transform: translateY(-2px);

    box-shadow: 0 8px 18px rgba(63, 53, 37, .12);
}

@media (max-width: 600px) {
    .password-success-card {
        padding: 28px 20px;
    }

    .password-success-title {
        font-size: 24px;
    }

    .password-success-btn {
        width: 100%;
    }
}

</style>

{% endblock %}
