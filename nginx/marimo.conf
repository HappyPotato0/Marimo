server {
    listen 80;
    server_name iwannabepotato.com www.iwannabepotato.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iwannabepotato.com www.iwannabepotato.com;

    ssl_certificate /etc/letsencrypt/live/iwannabepotato.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iwannabepotato.com/privkey.pem;

    charset utf-8;

    access_log /Marimo/logs/access.log;
    error_log /Marimo/logs/error.log error;

    location / {
        proxy_pass http://zakhartchouk:8000; # zakhartchouk - название контейнера

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

		proxy_connect_timeout 60s;
		proxy_read_timeout 60s;

        proxy_redirect off;
    }

    location /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /Marimo/staticfiles/;
    }
    location /media/ {
        alias /Marimo/media/;
    }
}