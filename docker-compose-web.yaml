services:
  nginx:
    image: nginx:latest
    container_name: nginx-server
    networks:
      - marimo-net
    restart: always
    expose:
      - 80
      - 443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./Marimo:/Marimo
      - ./staticfiles:/Marimo/staticfiles
      - ./media:/Marimo/media
      - ./logs:/Marimo/logs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
  web:
    build: .
    container_name: Marimo
    networks:
      - marimo-net
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --clear --noinput && gunicorn -c gunicorn.py Marimo.wsgi:application"
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - .:/Marimo

volumes:
  postgres-data:
    external: true

networks:
  marimo-net:
    external: true



